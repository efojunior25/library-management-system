spring:
  datasource:
    url: jdbc:mysql://localhost:3306/libraty
    username: ${DB_USERNAME:library_user}
    password: ${DB_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.biblioteca.management: INFO