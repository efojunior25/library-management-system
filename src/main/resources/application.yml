spring:
  application:
    name: biblioteca-management-system

  # H2 Config (Develop)
  datasource:
    url: jdbc:h2:mem:biblioteca
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Config
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console (Develop)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf
  thymeleaf:
    cache: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Logging
logging:
  level:
    com.biblioteca.management: DEBUG
    org.springframework.web: DEBUG